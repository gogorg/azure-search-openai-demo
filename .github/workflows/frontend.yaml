name: Frontend linting

on:
  push:
    branches: [ main ]
    paths:
      - "app/frontend/**"
  pull_request:
    branches: [ main ]
    paths:
      - "app/frontend/**"

jobs:
    prettier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: Run prettier on frontend
              run: |
                cd ./app/frontend
                npm install
                npx prettier --check .
    dep-scan:
      runs-on: ubuntu-latest
      steps:
        - name: Dependency Review
          uses: actions/dependency-review-action@v5.0.0
